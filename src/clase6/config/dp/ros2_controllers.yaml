controller_manager:
  ros__parameters:
    update_rate: 200 #Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    pid_controller:
      type: pid_controller/PidController

pid_controller:
  ros__parameters:
    dof_names:
      - joint1
      - joint2
    command_interface: effort
    reference_and_state_interfaces:
      - position
      - velocity
    gains:
      joint1:
        p: 10.0
        i: 1.3
        d: 1.5
        i_clamp_max: 15.0
        i_clamp_min: -15.0
      joint2:
        p: 11.0
        i: 1.1
        d: 1.5
        i_clamp_max: 15.0
        i_clamp_min: -15.0
