controller_manager:
  ros__parameters:
    update_rate: 200 # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_action_controller:
      type: position_controllers/GripperActionController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    # gz_ros2_control reporta la velocidad pegada al limite del joint aunque el
    # brazo este quieto; sin tolerancia alta, FollowJointTrajectory nunca "para".
    constraints:
      stopped_velocity_tolerance: 10.0
      goal_time: 5.0
    gains:
      joint1:
        p: 36.0
        i: 276.0
        d: 1.95
        i_clamp_max: 15.0
        i_clamp_min: -15.0
      joint2:
        p: 36.0
        i: 570.0
        d: 0.95
        i_clamp_max: 15.0
        i_clamp_min: -15.0
      joint3:
        p: 36.0
        i: 570.0
        d: 0.95
        i_clamp_max: 15.0
        i_clamp_min: -15.0
      joint4:
        p: 36.0
        i: 570.0
        d: 0.95
        i_clamp_max: 15.0
        i_clamp_min: -15.0
      joint5:
        p: 36.0
        i: 570.0
        d: 0.95
        i_clamp_max: 15.0
        i_clamp_min: -15.0
      joint6:
        p: 36.0
        i: 570.0
        d: 0.95
        i_clamp_max: 15.0
        i_clamp_min: -15.0

gripper_action_controller:
  ros__parameters:
    joint: gripper_controller
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 5.0